  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.mono{font-family:"Source Code Pro",monospace;text-transform:uppercase;letter-spacing:.06em}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 16px}
header img{height:38px}
@media (prefers-color-scheme: dark){header img,.login img.logo{filter:invert(1)}}
header .tag{font-size:.7rem;font-weight:800;color:var(--muted)}
.card{background:var(--surface);border-radius:18px;box-shadow:0 14px 34px rgba(20,20,22,.12);padding:20px 18px;margin-bottom:14px}
.hidden{display:none !important}
/* login */
.login{text-align:center}
.login img.logo{height:58px;margin:4px 0 6px}
.login h1{font-size:1rem;margin:4px 0 16px}
label{display:block;text-align:left;font-size:.72rem;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;font-size:1rem;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
.sys{display:grid;gap:8px}
.sys button{text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 13px;font:inherit;font-size:.9rem;cursor:pointer}
.sys button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn:disabled{opacity:.55}
.block{width:100%;margin-top:16px;padding:14px}
.err{color:var(--late);font-size:.85rem;min-height:1.2em;margin-top:10px}
/* clock */
.who{font-size:.72rem;color:var(--muted);text-align:center}
.time{font-family:"Source Code Pro",monospace;font-weight:800;font-size:3.7rem;text-align:center;line-height:1.1;margin:4px 0}
.date{text-align:center;font-size:.8rem;color:var(--muted)}
.shift{text-align:center;margin:12px 0 4px}
.warn{background:#FDECEC;color:#B00010;border-radius:12px;padding:9px 12px;margin:10px 0;font-weight:600;font-size:.9rem;text-align:center}
.geo{text-align:center;font-size:.8rem;color:var(--muted);margin:6px 0 0}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.rec div{background:var(--chip);border-radius:14px;padding:10px;text-align:center}
.rec small{display:block;font-size:.62rem;color:var(--muted)}
.rec b{display:block;font-family:"Source Code Pro",monospace;font-size:1.55rem}
.rec em{display:block;font-style:normal;font-size:.75rem;color:#B00010;margin-top:2px}
.pill{display:inline-block;font-family:"Source Code Pro",monospace;font-size:.62rem;font-weight:800;padding:2px 7px;border-radius:4px;margin-top:4px;text-transform:uppercase}
.pill.ok{background:var(--ok);color:#fff}.pill.late{background:var(--late);color:#fff}.pill.na{background:var(--chip);color:var(--ink)}
.big{display:block;width:100%;border:0;border-radius:18px;padding:19px;font-family:"Source Code Pro",monospace;font-weight:800;font-size:1.2rem;letter-spacing:.08em;color:#fff;margin-top:14px;cursor:pointer;box-shadow:0 10px 24px rgba(20,20,22,.2)}
.big.in{background:#17171A}.big.out{background:var(--red)}
.big:disabled{opacity:.5}
.hint{text-align:center;font-size:.8rem;color:var(--muted);margin:8px 0 0}
.done{margin-top:14px;padding:14px;border-radius:14px;background:#E9F5E1;color:#21401A;font-weight:700;text-align:center}
h3{font-size:.95rem;margin:0 0 10px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;white-space:nowrap;vertical-align:top}
th{font-family:"Source Code Pro",monospace;font-size:.62rem;color:var(--muted);text-transform:uppercase}
td a{text-decoration:none}
.r{white-space:normal;color:var(--muted);font-size:.75rem;max-width:180px}
.miss{color:#B00010;font-size:.82rem;margin:10px 0 0}
.ths{white-space:nowrap}
.th{width:42px;height:52px;object-fit:cover;border-radius:6px;margin-right:4px;vertical-align:middle;border:1px solid var(--line)}
.pl{display:inline-block;white-space:normal;min-width:160px;max-width:240px;font-size:.76rem;line-height:1.35;color:var(--ink);text-decoration:none}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.foot .btn{font-size:.8rem;padding:9px 12px;background:rgba(255,255,255,.7)}
@media (prefers-color-scheme: dark){.foot .btn{background:rgba(34,35,38,.8)}}
/* modals */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,10,12,.62);display:flex;align-items:center;justify-content:center;padding:14px}
.box{background:var(--surface);border-radius:18px;padding:16px;width:min(440px,100%);max-height:94vh;overflow:auto;text-align:center}
.box h3{margin:2px 0 10px}
video{width:100%;max-height:58vh;object-fit:cover;border-radius:14px;background:#000;transform:scaleX(-1)}
.box img{width:100%;max-height:50vh;object-fit:contain;border-radius:14px;background:#000}
.act{display:flex;gap:10px;margin-top:12px}.act .btn{flex:1}
.spin{display:inline-block;width:1em;height:1em;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:#141416;color:#fff;padding:11px 16px;border-radius:12px;font-size:.88rem;z-index:80;max-width:92vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.demo{background:#141416;color:#fff;text-align:center;font-size:.72rem;padding:6px}
</style>
</head>

    <h1 class="mono">ลงเวลาเข้า-ออกงาน</h1>

<script>
/* ========================= SETTINGS ========================= */
// Web app links (…/exec) of each system. Staff choose their system once at sign-in.
const SYSTEMS = [
  // ↓ Paste the web app link (…/exec) of the SIAM CENTER system between the quotes
  { id: "siam", label: "Flagship Siam Center",
    url: "https://script.google.com/macros/s/AKfycbzixwNqZccDOvAQs8aOB2cgb4-uisx66Cg4bYOB4ukeCN9fAtSJHOKa0KfK2VrUTsw/exec" }
  // Later, to add the other branches, add a line like:
  // ,{ id: "main", label: "Central Ladprao · Central World · Mega Bangna · Central Pinklao · Gaysorn", url: "https://script.google.com/macros/s/…/exec" }
];
const MAX_PHOTO_AGE_MIN = 3;      // phone-camera fallback: refuse photos older than this
/* ============================================================ */

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const mins = t => { const a = String(t).split(":").map(Number); return a[0] * 60 + (a[1] || 0); };
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del(k){ try { localStorage.removeItem(k); } catch (e) {} } };
const DEMO = /[?&]demo\b/.test(location.search) || location.protocol === "file:" || /claude\.ai|claudeusercontent|anthropic/.test(location.hostname);
const S = { sess: store.get("mk.clock") || null, data: null, busy: false, geoP: null, geoWhy: "", sys: null };
let toastT;
function toast(m){ const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3200); }

/* ---------- API ---------- */
async function call(sys, body){
  if (DEMO) return demoCall(body);
  const res = await fetch(sys.url, { method: "POST", body: JSON.stringify(body), redirect: "follow" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

/* ---------- login ---------- */
function showLogin(msg){
  $("clockView").classList.add("hidden"); $("loginView").classList.remove("hidden");
  const last = store.get("mk.clock.last") || {};
  S.sys = SYSTEMS.find(s => s.id === last.sys) || SYSTEMS[0];
  $("sysList").innerHTML = SYSTEMS.map(s => '<button type="button" data-s="'+s.id+'" aria-pressed="'+(s.id === S.sys.id)+'">'+esc(s.label)+'</button>').join("");
  $("sysList").querySelectorAll("button").forEach(b => b.onclick = () => { S.sys = SYSTEMS.find(s => s.id === b.dataset.s); $("sysList").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); });
  if (last.name) $("nm").value = last.name;
  $("loginErr").textContent = msg || "";
}
$("goBtn").onclick = async () => {
  const name = $("nm").value.trim().toUpperCase(), code = $("pc").value.trim();
  if (!name || !code){ $("loginErr").textContent = "กรอกชื่อเล่นและ Passcode"; return; }
  if (!DEMO && /PASTE/.test(S.sys.url)){ $("loginErr").textContent = "ยังไม่ได้ตั้งลิงก์ของสาขานี้ในหน้าลงเวลา"; return; }
  const b = $("goBtn"); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
  try {
    const r = await call(S.sys, { action: "login", name, code });
    if (!r.ok){ $("loginErr").textContent = r.msg || "ล็อกอินไม่สำเร็จ"; return; }
    S.sess = { token: r.token, sys: S.sys.id }; store.set("mk.clock", S.sess); store.set("mk.clock.last", { sys: S.sys.id, name });
    $("pc").value = ""; await enter();
  } catch (e) { $("loginErr").textContent = "เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่"; console.error(e); }
  finally { b.disabled = false; b.textContent = "SIGN IN"; }
};
$("outBtn").onclick = () => { store.del("mk.clock"); S.sess = null; S.data = null; showLogin(); };
$("refBtn").onclick = () => load(true);

async function enter(){
  S.sys = SYSTEMS.find(s => s.id === S.sess.sys) || SYSTEMS[0];
  $("appLink").href = S.sys.url;
  $("loginView").classList.add("hidden"); $("clockView").classList.remove("hidden");
  S.geoWhy = ""; S.geoP = getGeo();            // ask for location early so it is ready when clocking
  await load();
}
async function load(showToast){
  try {
    const r = await call(S.sys, { action: "clockLoad", token: S.sess.token });
    if (r && r.auth === false){ store.del("mk.clock"); return showLogin("กรุณาล็อกอินใหม่"); }
    if (!r.ok){ toast(r.msg || "โหลดไม่สำเร็จ"); return; }
    S.data = r.data; render(); if (showToast) toast("อัปเดตแล้ว");
  } catch (e) { console.error(e); toast("เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่"); }
}

/* ---------- render ---------- */
const pill = s => { s = String(s || ""); const c = /^Late/.test(s) ? "late" : /^On time/.test(s) ? "ok" : "na"; return s ? '<span class="pill '+c+'">'+esc(s)+'</span>' : ""; };
const mapLink = loc => { const m = String(loc || "").match(/(-?\d+\.\d+),(-?\d+\.\d+)/); return m ? '<a href="https://maps.google.com/?q='+m[1]+','+m[2]+'" target="_blank" rel="noopener">📍</a>' : "–"; };
const photo = u => /^https?:/.test(u || "") ? '<a href="'+esc(u)+'" target="_blank" rel="noopener">📷</a>' : "";
const thumbCell = (t, u) => t ? (/^https?:/.test(u || "") ? '<a href="'+esc(u)+'" target="_blank" rel="noopener">' : "")+'<img class="th" src="'+t+'" alt="Selfie">'+(/^https?:/.test(u || "") ? "</a>" : "") : photo(u);
const placeCell = (p, loc) => { const m = String(loc || "").match(/(-?\d+\.\d+),(-?\d+\.\d+)/), href = m ? "https://maps.google.com/?q="+m[1]+","+m[2] : "";
  if (!p) return mapLink(loc); return href ? '<a class="pl" href="'+href+'" target="_blank" rel="noopener">📍 '+esc(p)+'</a>' : '<span class="pl">'+esc(p)+'</span>'; };
function makeThumb(dataUrl){ return new Promise(res => { const img = new Image(); img.onload = () => {
  const s = Math.min(1, 240 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
  cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s); cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  res(cv.toDataURL("image/jpeg", 0.62)); }; img.onerror = () => res(""); img.src = dataUrl; }); }
const longDate = iso => new Intl.DateTimeFormat("th-TH", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(new Date(iso + "T12:00:00"));
const shortDate = iso => new Intl.DateTimeFormat("th-TH", { weekday: "short", day: "numeric", month: "short" }).format(new Date(iso + "T12:00:00"));
function render(){
  const c = S.data; if (!c) return;
  const t = nowHM(), r = c.row, st = !r ? "none" : r.outAt ? "done" : "in";
  const late = (st === "none" && c.shift && c.shift.start) ? Math.max(0, mins(t) - mins(c.shift.start) - c.grace) : 0;
  let h = '<div class="who mono">'+esc(c.name)+(c.pos ? " · "+esc(c.pos) : "")+" · "+esc(c.type || "")+'</div>'+
    '<div class="time" id="tm">'+t+'</div><div class="date">'+esc(longDate(c.today))+' · '+esc(c.branch || "-")+'</div>'+
    '<div class="shift">'+(c.shift && c.shift.label ? 'กะวันนี้ <b>'+esc(c.shift.label)+'</b>' : 'ไม่มีกะในตารางที่ประกาศ')+'</div>';
  if (late > 0) h += '<div class="warn">⚠ เลยเวลาเข้างานแล้ว '+late+' นาที · ต้องใส่เหตุผลการมาสาย</div>';
  if (r) h += '<div class="rec"><div><small class="mono">Clock in</small><b>'+esc(r.inAt)+'</b>'+pill(r.status)+(r.late ? '<em>สาย '+esc(r.late)+' นาที</em>' : '')+'</div><div><small class="mono">Clock out</small><b>'+esc(r.outAt || "–")+'</b></div></div>';
  if (st !== "done") h += '<button class="big '+(st === "none" ? "in" : "out")+'" id="bigBtn">📷 '+(st === "none" ? "CLOCK IN" : "CLOCK OUT")+'</button><p class="hint">กดแล้วถ่ายเซลฟี่ ระบบบันทึกเวลาและตำแหน่งให้อัตโนมัติ</p>';
  else h += '<div class="done">✓ ลงเวลาครบแล้ววันนี้</div>';
  h += '<p class="geo" id="geoLine">📍 กำลังหาตำแหน่ง…</p>';
  $("clockCard").innerHTML = h;
  const b = $("bigBtn"); if (b) b.onclick = () => openCamera(st === "none" ? "in" : "out");
  updateGeoLine();
  // team (store manager / manager)
  if (c.team){
    $("teamCard").classList.remove("hidden");
    $("teamCard").innerHTML = '<h3>ลงเวลาวันนี้ · ทีม</h3><div class="tw"><table><thead><tr><th>Name</th><th>Shift</th><th>In</th><th>Status</th><th>Out</th><th>Selfie</th><th>Location</th><th>Dist.</th></tr></thead><tbody>'+
      (c.team.rows.length ? c.team.rows.map(x => '<tr><td><b>'+esc(x.name)+'</b><div class="r">'+esc(x.branch)+'</div></td><td>'+esc(x.shift || "–")+'</td><td>'+esc(x.inAt)+'</td><td>'+pill(x.status)+(x.late ? " "+esc(x.late)+"m" : "")+(x.reason ? '<div class="r">'+esc(x.reason)+'</div>' : "")+'</td><td>'+esc(x.outAt || "–")+'</td><td class="ths">'+thumbCell(x.inThumb, x.inPhoto)+thumbCell(x.outThumb, x.outPhoto)+'</td><td>'+placeCell(x.inPlace, x.inLoc)+'</td><td>'+(x.inDist ? esc(x.inDist)+" m" : "–")+'</td></tr>').join("") : '<tr><td colspan="8" style="text-align:center;color:var(--muted)">ยังไม่มีใครลงเวลาวันนี้</td></tr>')+
      '</tbody></table></div>'+(c.team.missing && c.team.missing.length ? '<p class="miss"><b>มีกะวันนี้ แต่ยังไม่ลงเวลา:</b> '+c.team.missing.map(m => esc(m.name)+' ('+esc(m.shift)+')').join(", ")+'</p>' : "");
  } else $("teamCard").classList.add("hidden");
  if (c.history && c.history.length){
    $("histCard").classList.remove("hidden");
    $("histCard").innerHTML = '<h3>ประวัติการลงเวลาของฉัน</h3><div class="tw"><table><thead><tr><th>Date</th><th>Shift</th><th>In</th><th>Status</th><th>Out</th><th>Selfie</th></tr></thead><tbody>'+
      c.history.map(x => '<tr><td>'+esc(shortDate(x.date))+'</td><td>'+esc(x.shift || "–")+'</td><td>'+esc(x.inAt)+'</td><td>'+pill(x.status)+(x.late ? " "+esc(x.late)+"m" : "")+'</td><td>'+esc(x.outAt || "–")+'</td><td class="ths">'+thumbCell(x.inThumb, x.inPhoto)+thumbCell(x.outThumb, x.outPhoto)+'</td></tr>').join("")+'</tbody></table></div>';
  } else $("histCard").classList.add("hidden");
}
setInterval(() => { const e = $("tm"); if (e) e.textContent = nowHM(); }, 10000);

/* ---------- location ---------- */
function getGeo(){
  const raw = new Promise(res => {
    if (!navigator.geolocation){ S.geoWhy = "เบราว์เซอร์นี้ไม่รองรับตำแหน่ง"; return res(null); }
    navigator.geolocation.getCurrentPosition(p => { S.geoWhy = ""; res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }); },
      err => { S.geoWhy = err && err.code === 1 ? "ยังไม่ได้อนุญาตตำแหน่ง · ตั้งค่า > Safari/Chrome > ตำแหน่ง > อนุญาต" : err && err.code === 3 ? "หาตำแหน่งไม่ทัน · เปิด GPS แล้วลองใหม่" : "หาตำแหน่งไม่ได้"; res(null); },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
  });
  const limit = new Promise(res => setTimeout(() => { if (!S.geoWhy) S.geoWhy = "หาตำแหน่งไม่ทัน"; res(null); }, 11000));
  const p = Promise.race([raw, limit]); p.then(g => { S.geo = g; updateGeoLine(); }); return p;
}
function updateGeoLine(){
  const el = $("geoLine"); if (!el) return;
  if (S.geo) el.textContent = "📍 พบตำแหน่ง (±" + Math.round(S.geo.acc) + " m)";
  else if (S.geoWhy) el.textContent = "📍 " + S.geoWhy;
}

/* ---------- camera ---------- */
function stamp(dataUrl){
  return new Promise(res => { const img = new Image(); img.onload = () => {
    const cv = document.createElement("canvas"); cv.width = img.width; cv.height = img.height; const g = cv.getContext("2d");
    g.drawImage(img, 0, 0); const d = new Date();
    const txt = (S.data ? S.data.name : "") + " · " + new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric" }).format(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    const fs = Math.max(16, Math.round(cv.width / 26)); g.font = "700 " + fs + "px sans-serif";
    g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(0, cv.height - fs * 1.9, cv.width, fs * 1.9);
    g.fillStyle = "#fff"; g.fillText(txt, fs * .6, cv.height - fs * .6);
    res(cv.toDataURL("image/jpeg", 0.72)); }; img.src = dataUrl; });
}
function shrink(file){
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => { const img = new Image(); img.onload = () => {
    const s = Math.min(1, 720 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
    cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s); cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    res(cv.toDataURL("image/jpeg", 0.8)); }; img.onerror = rej; img.src = fr.result; }; fr.onerror = rej; fr.readAsDataURL(file); });
}
async function openCamera(kind){
  S.kind = kind; S.geoWhy = ""; S.geo = null; S.geoP = getGeo();
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return fileCamera();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 960 } }, audio: false }); }
  catch (e) { console.warn(e); return askFileCamera(); }
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = '<div class="box"><h3>'+(kind === "in" ? "Clock in" : "Clock out")+' · ถ่ายเซลฟี่</h3><video id="v" autoplay playsinline muted></video><div class="act"><button class="btn" id="vx">ยกเลิก</button><button class="btn primary" id="vs">📷 ถ่ายรูป</button></div></div>';
  document.body.appendChild(m);
  const v = m.querySelector("#v"); v.srcObject = stream;
  const stop = () => { stream.getTracks().forEach(t => t.stop()); m.remove(); };
  m.querySelector("#vx").onclick = stop;
  m.querySelector("#vs").onclick = async () => {
    if (!v.videoWidth){ toast("กล้องยังไม่พร้อม ลองอีกครั้ง"); return; }
    const sc = Math.min(1, 720 / Math.max(v.videoWidth, v.videoHeight)), cv = document.createElement("canvas");
    cv.width = Math.round(v.videoWidth * sc); cv.height = Math.round(v.videoHeight * sc);
    const g = cv.getContext("2d"); g.translate(cv.width, 0); g.scale(-1, 1); g.drawImage(v, 0, 0, cv.width, cv.height);
    const shot = cv.toDataURL("image/jpeg", 0.8); stop(); confirmClock(await stamp(shot), kind);
  };
}
function fileCamera(){ const i = $("fileIn"); i.value = ""; i.click(); }
function askFileCamera(){
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = '<div class="box"><h3>ถ่ายเซลฟี่</h3><p class="geo">เปิดกล้องในหน้าเว็บไม่ได้ (ยังไม่ได้อนุญาตกล้อง?) จะใช้กล้องของมือถือแทน รับเฉพาะรูปที่ถ่ายตอนนี้</p><div class="act"><button class="btn" id="fx">ยกเลิก</button><button class="btn primary" id="fg">📷 เปิดกล้อง</button></div></div>';
  document.body.appendChild(m);
  m.querySelector("#fx").onclick = () => m.remove();
  m.querySelector("#fg").onclick = () => { m.remove(); fileCamera(); };
}
$("fileIn").onchange = async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  if (f.lastModified && Date.now() - f.lastModified > MAX_PHOTO_AGE_MIN * 60000){ toast("ใช้รูปเก่าไม่ได้ กรุณาถ่ายเซลฟี่ใหม่ตอนนี้"); return; }
  try { confirmClock(await stamp(await shrink(f)), S.kind || "in"); } catch (err) { toast("อ่านรูปไม่ได้ ลองใหม่"); }
};
function confirmClock(img, kind){
  const c = S.data || {}, t = nowHM();
  const late = (kind === "in" && c.shift && c.shift.start) ? Math.max(0, mins(t) - mins(c.shift.start) - (c.grace || 0)) : 0;
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = '<div class="box"><h3>'+(kind === "in" ? "Clock in" : "Clock out")+' · '+t+'</h3><img src="'+img+'" alt="Selfie"><p class="geo" id="mg">📍 กำลังหาตำแหน่ง…</p>'+
    '<div id="ml"'+(late ? "" : ' class="hidden"')+'><p class="warn">⚠ สาย <b id="mlm">'+late+'</b> นาที · กรุณาใส่เหตุผล</p><textarea id="mr" rows="3" maxlength="300" placeholder="เหตุผลที่มาสาย เช่น รถติดหนัก / ไปหาหมอ"></textarea></div>'+
    '<div class="act"><button class="btn" id="mc">ถ่ายใหม่</button><button class="btn primary" id="mo">ยืนยัน</button></div></div>';
  document.body.appendChild(m);
  const mg = m.querySelector("#mg");
  (S.geoP || Promise.resolve(null)).then(g => { mg.textContent = g ? "📍 พบตำแหน่ง (±" + Math.round(g.acc) + " m)" : "📍 ไม่พบตำแหน่ง · " + (S.geoWhy || "ลองใหม่"); });
  m.querySelector("#mc").onclick = () => { m.remove(); openCamera(kind); };
  m.querySelector("#mo").onclick = async () => {
    const ok = m.querySelector("#mo"); if (ok.disabled) return;
    const reason = (m.querySelector("#mr") || {}).value || "";
    if (!m.querySelector("#ml").classList.contains("hidden") && !reason.trim()){ toast("กรุณาใส่เหตุผลการมาสาย"); m.querySelector("#mr").focus(); return; }
    ok.disabled = true; m.querySelector("#mc").disabled = true; ok.innerHTML = '<span class="spin"></span> กำลังบันทึก…';
    let g = S.geo; if (!g && S.geoP) g = await Promise.race([S.geoP, new Promise(r => setTimeout(() => r(null), 3000))]);
    try {
      const thumb = await makeThumb(img);
      const r = await call(S.sys, { action: "clockAction", token: S.sess.token, kind, photo: img.split(",")[1], lat: g ? g.lat : "", lng: g ? g.lng : "", acc: g ? g.acc : "", reason, thumb });
      if (r && r.auth === false){ m.remove(); store.del("mk.clock"); return showLogin("กรุณาล็อกอินใหม่"); }
      if (r && r.needReason){ m.querySelector("#ml").classList.remove("hidden"); m.querySelector("#mlm").textContent = r.late; toast(r.msg); ok.disabled = false; m.querySelector("#mc").disabled = false; ok.textContent = "ยืนยัน"; return; }
      toast(r.msg || "บันทึกแล้ว"); if (r.data) S.data = r.data; m.remove(); render();
    } catch (e) { console.error(e); toast("บันทึกไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่"); ok.disabled = false; m.querySelector("#mc").disabled = false; ok.textContent = "ยืนยัน"; }
  };
}

/* ---------- demo (preview only) ---------- */
const D = { rows: [] };
function demoCall(b){
  return new Promise(res => setTimeout(() => {
    const today = new Date().toISOString().slice(0, 10), t = nowHM();
    const data = () => { const mine = D.rows.filter(x => x.name === D.name);
      return { name: D.name, type: "Part Time", pos: "BR & PC", branch: "Flagship Siam Center", today, grace: 5, shift: { label: "09:00-18:00", start: "09:00" },
        row: mine.find(x => x.date === today) || null, history: mine.slice().reverse(), hasLocation: true }; };
    if (b.action === "login"){ if (b.name === "MIA" && b.code === "1234"){ D.name = b.name; return res({ ok: true, token: "demo" }); } return res({ ok: false, msg: "Wrong name or passcode." }); }
    if (!D.name) D.name = "MIA";
    if (b.action === "clockLoad") return res({ ok: true, data: data() });
    if (b.action === "clockAction"){
      const row = D.rows.find(x => x.name === D.name && x.date === today);
      if (b.kind === "in"){ if (row) return res({ ok: false, msg: "Already clocked in." , data: data() });
        const late = Math.max(0, mins(t) - mins("09:00") - 5);
        if (late && !b.reason) return res({ ok: false, needReason: true, late, msg: "You are " + late + " min late. Please add a reason." });
        D.rows.push({ date: today, name: D.name, shift: "09:00-18:00", inAt: t, status: late ? "Late" : "On time", late: late ? String(late) : "", reason: b.reason, outAt: "", inThumb: b.thumb || "" });
        return res({ ok: true, msg: "Clocked in at " + t + (b.lat !== "" ? " 📍" : ""), data: data() }); }
      if (!row) return res({ ok: false, msg: "Please clock in first.", data: data() });
      row.outAt = t; row.outThumb = b.thumb || ""; return res({ ok: true, msg: "Clocked out at " + t + ".", data: data() });
    }
  }, 500));
}

/* ---------- start ---------- */
if (DEMO) $("demoBar").classList.remove("hidden");
if (S.sess && S.sess.token) enter(); else showLogin();
